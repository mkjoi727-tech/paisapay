<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075e54">
  <meta name="description" content="Paisa Pay Android অ্যাপ ডাউনলোড করুন।">
  <title>Paisa Pay - Download App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #17332f;
      background: linear-gradient(145deg, #e6fff5, #edf4ff);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border-radius: 26px;
      box-shadow: 0 16px 50px #003c3018;
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 25px;
      color: white;
      font-size: 34px;
      font-weight: 800;
      background: linear-gradient(135deg, #087f69, #16c79a);
      box-shadow: 0 8px 20px #087f6930;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #075e54;
    }

    .subtitle {
      color: #64748b;
      line-height: 1.8;
      margin: 12px 0 24px;
    }

    .details {
      padding: 16px;
      margin-bottom: 22px;
      text-align: left;
      background: #f3faf7;
      border-radius: 16px;
      font-size: 14px;
    }

    .details div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
    }

    .details strong {
      color: #075e54;
    }

    .download {
      display: block;
      padding: 16px;
      color: white;
      text-decoration: none;
      font-weight: 750;
      font-size: 17px;
      background: linear-gradient(100deg, #087f69, #10b981);
      border-radius: 14px;
      box-shadow: 0 7px 18px #087f6925;
    }

    .download:hover {
      filter: brightness(.95);
    }

    .note {
      margin: 18px 0 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.8;
    }

    footer {
      margin-top: 25px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo" aria-hidden="true">PP</div>

    <h1>Paisa Pay</h1>

    <p class="subtitle">
      আপনার Android ফোনে Paisa Pay অ্যাপ ডাউনলোড করতে
      নিচের বাটনে চাপ দিন।
    </p>

    <section class="details" aria-label="অ্যাপের তথ্য">
      <div>
        <span>অ্যাপের নাম</span>
        <strong>Paisa Pay</strong>
      </div>
      <div>
        <span>ফাইলের ধরন</span>
        <strong>Android APK</strong>
      </div>
      <div>
        <span>ডাউনলোড</span>
        <strong>বিনামূল্যে</strong>
      </div>
    </section>

    <a class="download" href="./base.apk" download="base.apk">
      ⬇ অ্যাপ ডাউনলোড করুন
    </a>

    <p class="note">
      নিরাপত্তার জন্য শুধু বিশ্বাসযোগ্য APK ইনস্টল করুন।
      ইনস্টল করার আগে ফাইলের উৎস যাচাই করুন।
    </p>

    <footer>
      © Paisa Pay
    </footer>
  </main>
</body>
</html>
